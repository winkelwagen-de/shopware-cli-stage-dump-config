name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: php-actions/composer@v1
        with:
          php_version: '8.2'
          args: --no-interaction --prefer-dist

      - name: Reject manual dist changes
        if: github.event_name == 'pull_request'
        run: php bin/check-dist-not-changed

      - name: Validate plugin configs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            php bin/validate-dump-config --changed-only --skip-dist-check
          else
            php bin/validate-dump-config --skip-dist-check
          fi

      - name: Verify merged dump config builds
        run: php bin/build-dump-config

  publish:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: php-actions/composer@v1
        with:
          php_version: '8.2'
          args: --no-interaction --prefer-dist

      - name: Build merged dump config
        run: php bin/build-dump-config

      - name: Commit updated dist if changed
        run: |
          git add dist/shopware-gdpr-dump.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c commit.gpgsign=false commit -m "[ci] rebuild dump config"
          git push
